<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Thinking: the firefly with three amber dots at its top right. -->
  <defs>
    <linearGradient id="nemu-mascot-thinking-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDB35A"/>
      <stop offset="1" stop-color="#E07A16"/>
    </linearGradient>
    <radialGradient id="nemu-mascot-thinking-glow">
      <stop offset="0.4" stop-color="#F59331" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F59331" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="18" r="15" fill="url(#nemu-mascot-thinking-glow)"/>
  <ellipse cx="8" cy="12" rx="6" ry="3.4" transform="rotate(18 8 12)" fill="#FFE7C7" stroke="#fff" stroke-width="0.8"/>
  <ellipse cx="24" cy="12" rx="6" ry="3.4" transform="rotate(-18 24 12)" fill="#FFE7C7" stroke="#fff" stroke-width="0.8"/>
  <circle cx="16" cy="18" r="8.5" fill="url(#nemu-mascot-thinking-body)" stroke="#fff" stroke-width="2.5"/>
  <ellipse cx="13" cy="17.5" rx="1.5" ry="1.9" fill="#fff"/>
  <ellipse cx="19" cy="17.5" rx="1.5" ry="1.9" fill="#fff"/>
  <circle cx="23.5" cy="4" r="1.3" fill="#E07A16"/>
  <circle cx="26.8" cy="4" r="1.3" fill="#E07A16"/>
  <circle cx="30.1" cy="4" r="1.3" fill="#E07A16"/>
