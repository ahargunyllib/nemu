<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang GTK (tiruan)</title>
<style>
  :root { --ink:#1f2933; --muted:#5f6b76; --line:#d5dade; --head:#2d3e50; --side:#f3f4f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; font-size:16px; }
  header { background:var(--head); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:24px; }
  header a { color:#fff; text-decoration:none; }
  .wrap { display:flex; min-height:calc(100vh - 64px); }
  nav { width:230px; background:var(--side); padding:16px 0; }
  nav a { display:block; padding:11px 24px; color:var(--ink); text-decoration:none; font-size:17px; }
  nav a.active { font-weight:bold; }
  main { flex:1; padding:24px 30px; max-width:1100px; display:flex; flex-direction:column; }
  h1 { font-size:26px; margin:0 0 16px; }
  p { margin:6px 0; color:#3e4c59; font-size:17px; }
  .galat { border:2px solid #c62828; background:#fdecea; padding:14px 20px; margin-top:20px; }
  .galat b { color:#c62828; font-size:18px; display:block; margin-bottom:6px; }
  .galat span { line-height:1.6; }
  .ok { border:1px solid #7fb38a; background:#e7f4ea; padding:14px 20px; margin-top:20px; }
  button { font-size:16px; padding:10px 18px; border-radius:4px; border:1px solid var(--head); background:var(--head); color:#fff; cursor:pointer; margin-top:16px; }
  footer { margin-top:auto; padding-top:32px; color:#8a949e; font-size:13px; }
</style>
</head>
<body>
<header><b>Ruang GTK (tiruan)</b><span>Siti Aminah, S.Pd. &nbsp;|&nbsp; <a href="#/kinerja" id="menu-keluar">Keluar</a></span></header>
<div class="wrap">
  <nav aria-label="Menu utama">
    <a href="#/beranda" id="menu-beranda">Beranda</a>
    <a href="#/kinerja" id="menu-kinerja">Pengelolaan Kinerja</a>
    <a href="#/e-kinerja" id="menu-e-kinerja">E-Kinerja</a>
    <a href="#/data-saya" id="menu-data-saya">Data Saya</a>
    <a href="#/bantuan" id="menu-bantuan">Bantuan</a>
  </nav>
  <main>
    <div id="app"></div>
    <footer>TIRUAN UNTUK UJI NEMU. Bukan tampilan aplikasi asli. Teks pesan error mengikuti laporan pengguna di publik.</footer>
  </main>
</div>
<script>
// Kasus uji F2-3: SKP gagal dialirkan ke E-Kinerja karena akun belum ditandai sebagai User Ruang GTK.
// Guru membereskannya sendiri dengan tombol "Sinkro Ruang GTK" di E-Kinerja.
const halaman = {
  "#/beranda": () => `<h1>Beranda</h1><p>Selamat datang, Siti Aminah, S.Pd.</p><p>SDIT Nusantara · NIP 197003152000032001</p>`,
  "#/kinerja": () => `<h1>Pengelolaan Kinerja 2026</h1>
    <p>Perencanaan SKP: 100% selesai</p>
    <p>Status kirim ke E-Kinerja:</p>
    <div class="galat" role="alert" id="galat-skp"><b>Data Perencanaan (SKP) Anda gagal dialirkan ke E-Kinerja</b>
    <span>Alasan: Tidak ditandai sebagai User Ruang GTK. Mohon coba lagi atau Anda dapat juga menekan tombol "Sinkro Ruang GTK" di E-Kinerja dan ikuti petunjuknya.</span></div>`,
  "#/e-kinerja": () => `<h1>E-Kinerja</h1>
    <p>Akun: Siti Aminah, S.Pd. (NIP 197003152000032001)</p>
    <p>Status pengguna Ruang GTK: <b id="status-user-gtk">Belum ditandai</b></p>
    <p>Tekan tombol di bawah untuk menyinkronkan akun E-Kinerja dengan Ruang GTK.</p>
    <button id="btn-sinkro-ruang-gtk">Sinkro Ruang GTK</button><div id="hasil-sinkro"></div>`,
  "#/data-saya": () => `<h1>Data Saya</h1><p>Nama: Siti Aminah, S.Pd.</p><p>NIP: 197003152000032001</p><p>Satuan pendidikan: SDIT Nusantara</p>`,
  "#/bantuan": () => `<h1>Bantuan</h1><p>Hubungi operator sekolah bila data Anda tidak sesuai.</p>`,
};
function route() {
  const h = halaman[location.hash] ? location.hash : "#/kinerja";
  document.querySelector("#app").innerHTML = halaman[h]();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === h));
  const sinkro = document.querySelector("#btn-sinkro-ruang-gtk");
  if (sinkro) sinkro.onclick = () => {
    document.querySelector("#status-user-gtk").textContent = "Sudah ditandai";
    document.querySelector("#hasil-sinkro").innerHTML = `<div class="ok" role="status">Sinkronisasi berhasil. Akun Anda sudah ditandai sebagai User Ruang GTK. Kirim ulang SKP dari Pengelolaan Kinerja.</div>`;
  };
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
