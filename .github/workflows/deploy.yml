name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      ALCHEMY_STAGE: prod
      NODE_ENV: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check provider credentials
        run: pnpm --filter @nemu/infra exec alchemy provider check-env --provider Cloudflare
      # @nemu/ai and @nemu/contracts export ./dist, which is gitignored; the
      # Worker bundle can't resolve them unless they are built first.
      - name: Build workspace packages
        run: pnpm --filter @nemu/ai build
      - name: Deploy
        run: pnpm --filter @nemu/infra exec alchemy deploy --yes
