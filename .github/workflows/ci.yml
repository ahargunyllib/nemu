name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint, format, and type check
        run: pnpm run check
      - name: Test
        run: pnpm run test

  wa-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wa-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/wa-bot/go.mod
          cache-dependency-path: apps/wa-bot/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build the image
        run: docker build -t wa-bot .
